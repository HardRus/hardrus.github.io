<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="HardRus — Links">
  <title>HardRus — Links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-hover: #121212;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border: #1a1a1a;
      --border-hover: #333333;
    }
    
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    
    body {
      min-height: 100vh;
      margin: 0;
      padding: 60px 20px 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    main { width: 100%; max-width: 420px; }
    
    header { 
      margin-bottom: 40px; 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .avatar {
      display: block;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      object-fit: cover;
      filter: grayscale(30%) contrast(110%);
      border: 1px solid #1a1a1a;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
    }
    
    h1 { 
      margin: 0; 
      font-size: 24px; 
      font-weight: 600;
      letter-spacing: 0.5px; 
    }
    
    nav { display: grid; gap: 12px; }
    
    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px 12px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.25s ease;
    }
    
    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      background: #111111;
      border: 1px solid #222222;
      border-radius: 10px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }
    
    .icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    
    .label { 
      flex: 1; 
      font-weight: 500; 
      font-size: 15px;
      letter-spacing: 0.2px;
    }
    
    .arrow { 
      color: var(--text-muted); 
      font-size: 18px; 
      transition: all 0.25s ease;
    }
    
    .link:hover { 
      background: var(--surface-hover); 
      border-color: var(--border-hover); 
    }
    
    .link:hover .icon {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: scale(1.03);
    }

    .link:hover .arrow {
      transform: translate(2px, -2px);
      color: var(--text-main);
    }

    .link:focus-visible { 
      outline: 1px solid var(--text-muted); 
      outline-offset: 2px; 
    }

    @media (max-width: 360px) {
      body { padding: 40px 16px 24px; }
      .link { padding: 10px 16px 10px 10px; }
      .icon { flex: 0 0 38px; width: 38px; height: 38px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
